hyperparams:
  models:
    llm: "gpt-5-nano"
    embedding: "text-embedding-3-small"
    severity_model: "dcim"

  lower_path:
    severity_threshold: 2
    min_cluster_size: 3
    macro_severity_model: "decayed_weighted"
    half_life_hours: 18.0
    climate_window_hours: 24.0

  upper_path:
    dcim:
      dcim_half_life_hours: 4.0
      dcim_beta_penalty: 0.2
      dcim_gamma_consensus: 0.3
      dcim_delta_velocity: 0.3
      dcim_kappa_scale: 1.0
      dcim_recent_window_hours: 0.5

  windows:
    signal_hours: 16.0
    feature_store_max_hours: 36.0

  signal:
    neutral_threshold: 0.15
    macro_align_bonus: 0.25
    macro_conflict_penalty: 0.5
    macro_veto: true
    veto_coverage: 0.5
    veto_strength_cap: 0.4
    macro_conviction_scale: 4.0
