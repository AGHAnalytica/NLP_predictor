[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NLP_predictor"
dynamic = ["version"]
description = "NLP system for market prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Individual contributors
authors = [
    { name = "Norbert Jarzmik", email = "" },
    { name = "Rafał Mazur", email = "" },
    { name = "Konrad Zatorski", email = "kodiz2005@gmail.com" },
    { name = "Filip Wojtczak", email = "" },
    { name = "Wojciech Kocemba", email = "" },
    { name = "Bartek Tasak", email = "" },
    { name = "Filip Kontek", email = "" },
    { name = "Olga Ehrenfeld", email = "" },
    { name = "Andrii-Dmytro Kilnytskyi", email = "" },
]

# Organization or core maintainers
maintainers = [
    { name = "AGH Analytica", email = "" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "anyio>=4.3.0",
    "google-genai>=2.4.0",
    "pandas>=3.0.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
]
lint = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.hatch.version]
path = "src/nlp_predictor/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --asyncio-mode=auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
